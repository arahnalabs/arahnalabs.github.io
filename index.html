<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arahna Labs</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        max-width: 680px;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Arahna Labs</h1>
      <p>Welcome to Arahna Labs. Our website is under active development.</p>
    </main>
  </body>
</html>
